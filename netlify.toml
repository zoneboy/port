[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Friendly API paths -> serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback (client-side routing / refreshes)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
